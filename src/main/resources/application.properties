spring.application.name=Ejercicio5MyAPIGestor
server.port=${PORT:8081}

# Database Configuration (Local MariaDB or Render Cloud DB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/dbgestor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:linux}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.mariadb.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP Pool Optimization
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Actuator & Prometheus Observability
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
