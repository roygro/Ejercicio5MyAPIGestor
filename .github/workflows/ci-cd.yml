name: CI/CD Pipeline - Cloud Quality & Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, JaCoCo Tests & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones disabled for better Sonar analysis

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Unit Tests with JaCoCo
        run: |
          mvn clean test jacoco:report
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload JaCoCo Code Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report-backend
          path: target/site/jacoco/
          retention-days: 7

  security-sast:
    name: SAST Security Scan (Semgrep)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --error --exclude "target/" --exclude ".git/"
        continue-on-error: true

  sonarcloud-analysis:
    name: Code Quality & Security (SonarCloud)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            mvn clean verify sonar:sonar \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          else
            echo "::notice ::SONAR_TOKEN is not configured in GitHub Secrets yet. Skipping SonarCloud step."
            echo "Configure SONAR_TOKEN to enable live SonarCloud analysis in GitHub."
          fi
